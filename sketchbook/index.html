<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1e21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스케치북">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* home-screen app: keep the toolbars clear of the notch and home indicator, no page bounce or long-press menus */
.app { box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
</style>
<title>나의 스케치북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Dodum&family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
/* Layout: painting-app shell. Top bar, contextual tool options, left tool rail, centre workspace with a zoomable canvas,
   right panel (color + layers). Deliberately single dark theme, like most painting apps, so the artwork stands out. */
:root {
  --app: #1d1e21;
  --panel: #26272b;
  --raised: #313338;
  --hover: #3a3c42;
  --work: #151618;
  --line: #3b3d43;
  --text: #e9eaee;
  --muted: #9b9ea6;
  --accent: #4d8dff;
  --accent-soft: rgba(77, 141, 255, .18);
  --font-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--app); color: var(--text); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }

button, select, input { font: inherit; color: inherit; }
button {
  background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 0 10px; min-height: 32px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap;
}
button:hover { background: var(--hover); }
button:disabled { opacity: .35; cursor: default; background: transparent; }
button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: rgba(77,141,255,.4); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon { padding: 0; width: 34px; min-height: 34px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.primary { background: var(--accent); color: #fff; font-weight: 600; }
.primary:hover { background: #3f7ef0; }
select, input[type="number"], input[type="text"] {
  background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 28px; box-sizing: border-box;
}
input[type="range"] { accent-color: var(--accent); }

/* top bar */
.top { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 48px; box-sizing: border-box; }
.brand { font-weight: 600; font-size: 14px; padding: 0 8px 0 2px; letter-spacing: -.01em; }
.brand b { color: var(--accent); font-weight: 600; }
.vsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.spacer { flex: 1; }
.zoom { display: flex; align-items: center; background: var(--raised); border-radius: 8px; }
#zoom-val { min-width: 58px; font-variant-numeric: tabular-nums; }
.docsize { color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px; }

/* options bar */
.opts { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: var(--app); border-bottom: 1px solid var(--line); min-height: 44px; box-sizing: border-box; overflow-x: auto; white-space: nowrap; }
.opts .hint { color: var(--muted); }
.seg { display: inline-flex; background: var(--raised); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { min-height: 28px; padding: 0 9px; border-radius: 6px; }
.brush-btn { background: var(--raised); padding: 0 8px; gap: 8px; min-height: 34px; }
.brush-btn[aria-expanded="true"] { border-color: var(--accent); }
.brush-btn svg.i:first-child, .menu svg.i { width: 20px; height: 20px; }
.brush-btn canvas, .menu canvas { width: 52px; height: 22px; border-radius: 4px; background: #f4f4f1; flex: none; }
.brush-btn span { min-width: 4.5em; text-align: left; }
.menu { position: fixed; z-index: 20; width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 2px; }
.menu button { justify-content: flex-start; gap: 10px; min-height: 40px; padding: 0 10px; }
.menu button[aria-selected="true"] { background: var(--accent); color: #fff; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
.sl { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.sl input[type="range"] { width: 120px; }
.sl output { color: var(--text); min-width: 40px; font-variant-numeric: tabular-nums; }
.sticker { font-size: 20px; width: 34px; padding: 0 !important; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

/* body */
.body { flex: 1; min-height: 0; display: flex; position: relative; }
.rail { width: 52px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; box-sizing: border-box; }
.rail .tool { width: 40px; min-height: 40px; padding: 0; border-radius: 10px; flex: none; }
.rail .tool svg.i { width: 20px; height: 20px; }
.rail .tool[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
.chips { margin-top: auto; position: relative; width: 40px; height: 44px; flex: none; }
.chip { position: absolute; width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; min-height: 0; }
#chip1 { left: 0; top: 0; z-index: 1; }
#chip2 { right: 0; bottom: 0; }

.work { flex: 1; min-width: 0; position: relative; background: var(--work); overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#text-input {
  position: absolute; z-index: 2; background: rgba(77,141,255,.08); border: 1px dashed var(--accent); outline: none;
  resize: none; overflow: hidden; padding: 0; margin: 0; line-height: 1.25; white-space: pre; min-width: 40px;
}

/* right panel */
.panel { width: 268px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel section { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; display: flex; align-items: center; justify-content: space-between; min-height: 20px; }
.sv { position: relative; height: 150px; border-radius: 8px; overflow: hidden; touch-action: none; cursor: crosshair; }
.sv canvas, .hue canvas { width: 100%; height: 100%; display: block; }
.knob { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%, -50%); pointer-events: none; }
.hue { position: relative; height: 14px; border-radius: 7px; overflow: visible; touch-action: none; cursor: pointer; }
.hue canvas { border-radius: 7px; }
.hue .knob { top: 50%; width: 10px; height: 18px; border-radius: 4px; }
.hexrow { display: flex; align-items: center; gap: 8px; }
.hexrow .cur { width: 28px; height: 28px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
#hex { width: 92px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
.swatches { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; min-height: 22px; }
.swatches button { min-height: 0; aspect-ratio: 1; padding: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.swatches button:hover { transform: scale(1.1); }
.sublabel { color: var(--muted); font-size: 11px; }

.layers-sec { flex: 1; min-height: 0; border-bottom: none !important; }
.layer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 60px; flex: 1; }
.layer { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: var(--raised); }
.layer[aria-selected="true"] { border-color: var(--accent); background: #2f3a52; }
.layer canvas { width: 52px; height: 38px; border-radius: 4px; flex: none; background: repeating-conic-gradient(#c9ccd2 0 25%, #f2f3f5 0 50%) 0 0 / 10px 10px; }
.layer .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.layer .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer .sub { color: var(--muted); font-size: 11px; }
.layer .eye { width: 28px; min-height: 28px; padding: 0; }
.layer .eye[aria-pressed] { background: transparent; border-color: transparent; color: var(--text); }
.layer .eye[aria-pressed="false"] { opacity: .45; }
.layer input[type="text"] { width: 100%; }
.bgrow { cursor: default; flex: none; }
.bgrow input[type="color"] { width: 52px; height: 38px; border: none; padding: 0; background: none; border-radius: 4px; cursor: pointer; }
.props { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 8px; color: var(--muted); }
.props select { width: 100%; }
.props output { color: var(--text); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.layer-actions { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.layer-actions button { padding: 0; }

/* overlays */
.toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5; background: #000c; color: #fff; padding: 8px 14px; border-radius: 999px; max-width: calc(100% - 32px); text-align: center; }
.modal { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(420px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow: auto; }
.dialog h2 { margin: 0; font-size: 16px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.presets button { background: var(--raised); flex-direction: column; align-items: flex-start; padding: 8px 10px; gap: 2px; min-height: 0; }
.presets button small { color: var(--muted); font-variant-numeric: tabular-nums; }
.dims { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); }
.dims input[type="number"] { width: 84px; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog .warn { color: #ffb86b; margin: 0; }
.preview img { max-width: 100%; max-height: 60vh; border-radius: 6px; background: repeating-conic-gradient(#c9ccd2 0 25%, #f2f3f5 0 50%) 0 0 / 16px 16px; }

.mobile-only { display: none !important; }
@media (max-width: 820px) {
  .brand, .docsize, .top .label { display: none; }
  .mobile-only { display: inline-flex !important; }
  .body { flex-direction: column; }
  .rail { order: 2; width: 100%; height: 56px; flex-direction: row; border-right: none; border-top: 1px solid var(--line); padding: 0 8px; overflow-x: auto; justify-content: flex-start; }
  .chips { margin: 0 0 0 auto; }
  .panel { position: absolute; right: 0; top: 0; bottom: 56px; z-index: 4; box-shadow: -8px 0 24px rgba(0,0,0,.4); max-width: calc(100% - 24px); }
  .panel:not(.open) { display: none; }
  .top { gap: 2px; padding: 6px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">나의 <b>스케치북</b></div>
    <button id="new-btn" title="새 캔버스"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M12.5 11v6M9.5 14h6"/></svg><span class="label">새 캔버스</span></button>
    <span class="vsep"></span>
    <button id="undo" class="icon" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button id="redo" class="icon" title="다시 하기 (Ctrl+Y)" aria-label="다시 하기" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <div class="spacer"></div>
    <div class="zoom">
      <button id="zoom-out" class="icon" title="축소 (-)" aria-label="축소"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button id="zoom-val" title="100%로 보기">100%</button>
      <button id="zoom-in" class="icon" title="확대 (+)" aria-label="확대"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
    <button id="fit" class="icon" title="화면에 맞추기 (Ctrl+0)" aria-label="화면에 맞추기"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="flip" class="icon" title="좌우 반전해서 보기" aria-label="좌우 반전해서 보기" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5z"/><path d="M16 7l5 5-5 5z"/></svg></button>
    <button id="sym" class="icon" title="좌우 대칭 그리기" aria-label="좌우 대칭 그리기" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7c-3 1-4 3-4 5s1 4 4 5"/><path d="M15 7c3 1 4 3 4 5s-1 4-4 5"/></svg></button>
    <button id="input-mode" aria-pressed="false"></button>
    <span class="docsize" id="docsize"></span>
    <div class="spacer"></div>
    <button id="panel-toggle" class="icon mobile-only" title="색상·레이어" aria-label="색상과 레이어 패널"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <button id="save" class="primary" title="PNG로 저장 (Ctrl+S)"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>저장</button>
  </header>

  <div class="opts" id="opts" role="toolbar" aria-label="도구 설정"></div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="도구">
      <div class="chips">
        <button class="chip" id="chip1" title="주 색상" aria-label="주 색상"></button>
        <button class="chip" id="chip2" title="보조 색상과 바꾸기 (X)" aria-label="보조 색상과 바꾸기"></button>
      </div>
    </nav>

    <div class="work" id="work">
      <canvas id="view" aria-label="캔버스"></canvas>
      <textarea id="text-input" rows="1" hidden aria-label="텍스트 입력"></textarea>
      <div class="toast" id="toast" hidden></div>
    </div>

    <aside class="panel" id="panel" aria-label="색상과 레이어">
      <section>
        <h3>색상 <button id="panel-close" class="icon mobile-only" aria-label="패널 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
        <div class="sv" id="sv"><canvas id="sv-cv" width="244" height="150"></canvas><i class="knob" id="sv-knob"></i></div>
        <div class="hue" id="hue"><canvas id="hue-cv" width="244" height="14"></canvas><i class="knob" id="hue-knob"></i></div>
        <div class="hexrow"><span class="cur" id="cur"></span><input type="text" id="hex" maxlength="7" aria-label="색상 코드" spellcheck="false"></div>
        <div class="swatches" id="palette" aria-label="팔레트"></div>
        <span class="sublabel">최근 사용한 색</span>
        <div class="swatches" id="recent" aria-label="최근 사용한 색"></div>
      </section>
      <section class="layers-sec">
        <h3>레이어 <span class="sublabel" id="layer-count"></span></h3>
        <ul class="layer-list" id="layer-list" role="listbox" aria-label="레이어 목록"></ul>
        <div class="layer bgrow">
          <button class="eye" id="bg-eye" aria-pressed="true" title="배경 보이기/숨기기 (숨기면 투명 PNG로 저장)" aria-label="배경 보이기"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <input type="color" id="bg-color" value="#ffffff" aria-label="배경색">
          <div class="meta"><span class="name">배경</span><span class="sub" id="bg-sub">흰색</span></div>
        </div>
        <div class="props">
          <span>합성</span><select id="blend" aria-label="합성 모드"></select><span></span>
          <span>불투명도</span><input type="range" id="layer-opacity" min="0" max="100" aria-label="레이어 불투명도"><output id="layer-opacity-out"></output>
        </div>
        <div class="layer-actions">
          <button id="l-add" title="새 레이어" aria-label="새 레이어"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="l-dup" title="레이어 복제" aria-label="레이어 복제"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/></svg></button>
          <button id="l-merge" title="아래 레이어와 합치기" aria-label="아래 레이어와 합치기"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
          <button id="l-clear" title="레이어 비우기" aria-label="레이어 비우기"><svg class="i" viewBox="0 0 24 24"><path d="M7 20h12"/><path d="M5 15l9-9 5 5-8 8H8z"/></svg></button>
          <button id="l-up" title="위로" aria-label="레이어 위로"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          <button id="l-down" title="아래로" aria-label="레이어 아래로"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
          <button id="l-del" title="레이어 삭제" aria-label="레이어 삭제"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </div>
      </section>
    </aside>
  </div>

  <div class="menu" id="brush-menu" role="listbox" aria-label="브러시 종류" hidden></div>

  <div class="modal" id="new-modal" hidden>
    <div class="dialog" role="dialog" aria-label="새 캔버스">
      <h2>새 캔버스</h2>
      <div class="presets" id="presets"></div>
      <div class="dims">
        <label>가로 <input type="number" id="new-w" min="64" max="3000"></label>
        <label>세로 <input type="number" id="new-h" min="64" max="3000"></label>
        <span>px (최대 3000)</span>
      </div>
      <div class="dims">
        <label>배경색 <input type="color" id="new-bg" value="#ffffff"></label>
        <label><input type="checkbox" id="new-transparent"> 투명 배경</label>
      </div>
      <p class="warn">지금 캔버스의 그림은 사라져요. 필요하면 먼저 저장하세요.</p>
      <div class="row"><button id="new-cancel">취소</button><button id="new-ok" class="primary">만들기</button></div>
    </div>
  </div>

  <div class="modal preview" id="preview" hidden>
    <div class="dialog">
      <h2>그림 저장</h2>
      <img id="preview-img" alt="저장할 그림">
      <p class="sublabel">이 화면에서는 바로 저장이 안 돼요. 그림을 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
      <div class="row"><button id="preview-close" class="primary">닫기</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;

      gesture = { type: "shape" };
    } else if (tool === "sticker") {
      live = { kind: "op", layer: l, op: { kind: "sticker", emoji: S.sticker, x: d.x, y: d.y, size: Math.round(Math.min(doc.w, doc.h) * 0.12) } };
      gesture = { type: "sticker", start: d };
    } else if (tool === "move") {
      live = { kind: "move", layer: l, dx: 0, dy: 0 }; gesture = { type: "move", start: d };
    }
    requestRender(true);
  });

  view.addEventListener("pointermove", e => {
    if (ignored.has(e.pointerId)) return;
    const sp = screenPt(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, sp);
    hover = e.pointerType === "touch" ? null : toDoc(sp);
    if (!gesture) { if (S.tool === "brush" || S.tool === "eraser") requestRender(); return; }
    const g = gesture;
    if (g.type === "pinch") {
      if (pointers.size < 2) return;
      const [a, b] = [...pointers.values()], c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      V.z = clamp(g.z0 * Math.hypot(a.x - b.x, a.y - b.y) / g.d0, 0.05, 32); anchorAt(g.anchor, c); requestRender(); return;
    }
    if (g.type === "pan") { V.ox = g.ox + sp.x - g.sx; V.oy = g.oy + sp.y - g.sy; repositionText(); requestRender(); return; }
    const d = toDoc(sp);
    if (g.type === "picker") { pickColor(d); return; }
    if (g.type === "stroke") {
      const op = live.op, evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      const f = 1 - (S.smooth / 100) * 0.92;
      for (const ev of (evs.length ? evs : [e])) {
        const r = toDoc(screenPt(ev)), last = g.last;
        const nx = last.x + (r.x - last.x) * f, ny = last.y + (r.y - last.y) * f;
        if (Math.hypot(nx - last.x, ny - last.y) < 0.4) continue;
        g.last = { x: nx, y: ny };
        op.points.push([nx, ny, ev.pressure || 0.5]);
      }
      g.raw = d; g.rawP = e.pressure || 0.5;
      if (!live.shade) drawStroke(lctx, op, live.st); // shading is processed once per frame in renderDoc
    } else if (g.type === "shape") {
      const op = live.op; let x2 = d.x, y2 = d.y; const dx = x2 - op.x1, dy = y2 - op.y1;
      if (e.shiftKey) {
        if (op.shape === "line" || op.shape === "arrow") {
          const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4), dd = Math.hypot(dx, dy);
          x2 = op.x1 + dd * Math.cos(a); y2 = op.y1 + dd * Math.sin(a);
        } else { const m = Math.max(Math.abs(dx), Math.abs(dy)); x2 = op.x1 + Math.sign(dx || 1) * m; y2 = op.y1 + Math.sign(dy || 1) * m; }
      }
      op.x2 = x2; op.y2 = y2;
    } else if (g.type === "sticker") {
      const dist = Math.hypot(d.x - g.start.x, d.y - g.start.y);
      if (dist > 8 / V.z) live.op.size = Math.max(12, dist * 2);
    } else if (g.type === "move") {
      live.dx = Math.round(d.x - g.start.x); live.dy = Math.round(d.y - g.start.y);
    }
    requestRender(true);
  });

  function endPointer(e) {
    if (ignored.delete(e.pointerId)) return;
    pointers.delete(e.pointerId);
    const g = gesture;
    if (!g) return;
    if (g.type === "pinch") { if (pointers.size === 0) gesture = null; return; }
    if (pointers.size) return;
    gesture = null; updateCursor();
    if (!live) { requestRender(); return; }
    const L = live; live = null;
    if (L.kind === "stroke") {
      if (g.raw && Math.hypot(g.raw.x - g.last.x, g.raw.y - g.last.y) > 0.5) L.op.points.push([g.raw.x, g.raw.y, g.rawP]);
      if (L.shade) {
        // bake the shaded pixels into an image so undo/redo replays exactly what was painted
        shadeSegment(L);
        const bb = strokeBox(L.op);
        if (bb.w > 0 && bb.h > 0) {
          const [img, ix] = mk(); img.width = bb.w; img.height = bb.h;
          ix.drawImage(lbuf, bb.x, bb.y, bb.w, bb.h, 0, 0, bb.w, bb.h);
          addOp(L.layer, { kind: "fill", shade: true, img, x: bb.x, y: bb.y, opacity: L.op.opacity });
        } else requestRender(true);
      } else addOp(L.layer, L.op);
    } else if (L.kind === "move") {
      if (L.dx || L.dy) addOp(L.layer, { kind: "move", dx: L.dx, dy: L.dy }); else requestRender(true);
    } else if (L.op.kind === "shape") {
      if (Math.hypot(L.op.x2 - L.op.x1, L.op.y2 - L.op.y1) < 2) requestRender(true); else addOp(L.layer, L.op);
    } else addOp(L.layer, L.op);
  }
  view.addEventListener("pointerup", endPointer);
  view.addEventListener("pointercancel", e => { if (ignored.delete(e.pointerId)) return; pointers.delete(e.pointerId); if (!pointers.size) cancelLive(); });
  view.addEventListener("pointerleave", () => { hover = null; requestRender(); });
  view.addEventListener("wheel", e => {
    e.preventDefault();
    const sp = screenPt(e);
    if (e.shiftKey) { V.ox -= e.deltaY || e.deltaX; repositionText(); requestRender(); return; }
    zoomAt(sp, V.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  view.addEventListener("contextmenu", e => e.preventDefault());

  /* ---------------- keyboard ---------------- */
  window.addEventListener("keydown", e => {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && k === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (mod && (k === "y" || (k === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }
    if (mod && k === "s") { e.preventDefault(); save(); return; }
    if (mod && k === "0") { e.preventDefault(); fit(); return; }
    if (mod && (k === "=" || k === "+")) { e.preventDefault(); zoomAt(wsCenter(), V.z * 1.25); return; }
    if (mod && k === "-") { e.preventDefault(); zoomAt(wsCenter(), V.z / 1.25); return; }
    if (mod) return;
    if (k === " ") { e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); requestRender(); } return; }
    const t = TOOLS.find(x => x[2].toLowerCase() === k); if (t) { setTool(t[0]); return; }
    if (k === "x") swapColors();
    else if (k === "[") setCurSize(curSize() * 0.85 - 1);
    else if (k === "]") setCurSize(curSize() * 1.15 + 1);
    else if (k === "+" || k === "=") zoomAt(wsCenter(), V.z * 1.25);
    else if (k === "-") zoomAt(wsCenter(), V.z / 1.25);
    else if (k === "escape") { closeBrushMenu(); $("new-modal").hidden = true; $("preview").hidden = true; $("panel").classList.remove("open"); }
  });
  window.addEventListener("keyup", e => { if (e.key === " ") { spaceDown = false; updateCursor(); requestRender(); } });

  /* ---------------- new canvas ---------------- */
  function screenSize() { const W = Math.max(320, work.clientWidth), H = Math.max(320, work.clientHeight), s = 1600 / Math.max(W, H); return [Math.round(W * s), Math.round(H * s)]; }
  $("new-btn").onclick = () => {
    const [sw, sh] = screenSize();
    const presets = [["화면 비율", sw, sh], ["정사각형", 2048, 2048], ["가로 16:9", 1920, 1080], ["세로 9:16", 1080, 1920], ["A4 세로", 1754, 2480], ["엽서 가로", 1800, 1200]];
    const p = $("presets"); p.innerHTML = "";
    presets.forEach(([n, w, h]) => {
      const b = document.createElement("button"); b.innerHTML = `${n}<small>${w} × ${h}</small>`;
      b.onclick = () => { $("new-w").value = w; $("new-h").value = h; }; p.appendChild(b);
    });
    $("new-w").value = doc.w; $("new-h").value = doc.h; $("new-bg").value = doc.bg; $("new-transparent").checked = !doc.bgVisible;
    $("new-modal").hidden = false;
  };
  $("new-cancel").onclick = () => $("new-modal").hidden = true;
  $("new-ok").onclick = () => {
    const w = clamp(+$("new-w").value || 1600, 64, 3000), h = clamp(+$("new-h").value || 1200, 64, 3000);
    resetDoc(w, h, $("new-bg").value, !$("new-transparent").checked);
    $("new-modal").hidden = true; toast(`${w} × ${h} 새 캔버스를 만들었어요.`);
  };

  function resetDoc(w, h, bg, bgVisible) {
    doc.w = w; doc.h = h; doc.bg = bg; doc.bgVisible = bgVisible;
    [docCv, tmp, sbuf, lbuf, mvCv, maskCv].forEach(c => { c.width = w; c.height = h; });
    layerSeq = 0; layers = [makeLayer()]; active = layers[0].id;
    undoStack = []; redoStack = []; live = null; gesture = null;
    $("docsize").textContent = `${w} × ${h}`;
    updateBgRow(); afterChange(); fit();
  }

  /* ---------------- save ---------------- */
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
  let downloads = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  function stamp() { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; }
  const inArtifact = !!(window.claude && window.claude.use);
  async function save() {
    await commitText(); renderDoc();
    const blob = await new Promise(r => docCv.toBlob(r, "image/png"));
    const name = `그림-${stamp()}.png`;
    if (downloads) {
      try { await downloads.save({ filename: name, data: blob }); toast("저장했어요."); return; }
      catch (err) {
        if (err && err.code === "declined") return;
        if (err && err.code === "rate_limited") { toast("저장 창이 이미 열려 있어요."); return; }
      }
    }
    if (!inArtifact) {
      // installed app / plain web page: phones get the share sheet ("이미지 저장"), computers a normal download
      const file = new File([blob], name, { type: "image/png" });
      const mobile = matchMedia("(pointer: coarse)").matches;
      if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (err) { if (err && err.name === "AbortError") return; }
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("저장했어요."); return;
    }
    $("preview-img").src = URL.createObjectURL(blob); $("preview").hidden = false;
  }
  $("save").onclick = save;
  $("preview-close").onclick = () => { $("preview").hidden = true; URL.revokeObjectURL($("preview-img").src); };

  /* ---------------- start ---------------- */
  /* ---------------- autosave (this device only) ---------------- */
  // Keeps the current picture in the browser's own storage so closing the app or refreshing doesn't lose it.
  // Each layer is stored as a PNG; undo history starts fresh after reopening.
  const DB = "sketchbook", STORE = "doc";
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function idbDo(mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => { const tx = db.transaction(STORE, mode), q = fn(tx.objectStore(STORE)); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
  }
  var saveTimer = 0, restoring = true;
  function scheduleSave() { if (restoring) return; clearTimeout(saveTimer); saveTimer = setTimeout(persist, 1200); }
  async function persist() {
    try {
      const ls = await Promise.all(layers.map(async l => ({
        name: l.name, visible: l.visible, opacity: l.opacity, blend: l.blend,
        png: l.ops.length ? await new Promise(r => l.cv.toBlob(r, "image/png")) : null,
      })));
      const data = { v: 1, w: doc.w, h: doc.h, bg: doc.bg, bgVisible: doc.bgVisible, active: layers.findIndex(l => l.id === active), layers: ls };
      await idbDo("readwrite", st => st.put(data, "current"));
    } catch (e) { /* storage unavailable (private window etc.): keep working without autosave */ }
  }
  async function restore() {
    try {
      const d = await idbDo("readonly", st => st.get("current"));
      if (!d || !d.layers || !d.layers.length) return false;
      resetDoc(d.w, d.h, d.bg, d.bgVisible);
      const built = [];
      layerSeq = 0;
      for (const s of d.layers) {
        const l = makeLayer(s.name); l.visible = s.visible; l.opacity = s.opacity; l.blend = s.blend;
        if (s.png) { const img = await createImageBitmap(s.png); l.ops = [{ kind: "image", img, opacity: 1, blend: "source-over" }]; rebuild(l); }
        built.push(l);
      }
      layers = built; active = (layers[d.active] || layers[layers.length - 1]).id;
      updateBgRow(); afterChange(); fit();
      return true;
    } catch (e) { return false; }
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden && !restoring) { clearTimeout(saveTimer); persist(); } });

  async function start() {
    resizeView();
    const [w, h] = screenSize();
    resetDoc(w, h, "#ffffff", true);
    setColor(S.color); setTool("brush");
    if (await restore()) toast("그리던 그림을 불러왔어요.");
    restoring = false;
  }
  requestAnimationFrame(start);
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
document.addEventListener("gesturestart", e => e.preventDefault());
</script>
</body>
</html>
